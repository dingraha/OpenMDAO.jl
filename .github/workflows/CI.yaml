name: Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags: '*'

jobs:
  OpenMDAOCore_jl:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version:
          - '1' # Leave this line unchanged. '1' will automatically expand to the latest stable 1.x release of Julia.
        os:
          - ubuntu-latest
          - macOS-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.arch }}
      - name: Add General Registry
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.Registry.add(RegistrySpec(url="https://github.com/JuliaRegistries/General"))
        # env:
        #       JULIA_PKG_USE_CLI_GIT: 'true'
      - name: OpenMDAOCore.jl Tests
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate("./julia/OpenMDAOCore.jl")
          Pkg.update()
          Pkg.test()
        # env:
        #       JULIA_PKG_USE_CLI_GIT: 'true'

  OpenMDAO_jl:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version:
          - '1' # Leave this line unchanged. '1' will automatically expand to the latest stable 1.x release of Julia.
        os:
          - ubuntu-latest
          - macOS-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.arch }}
      - name: Add General Registry
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.Registry.add(RegistrySpec(url="https://github.com/JuliaRegistries/General"))
        # env:
        #       JULIA_PKG_USE_CLI_GIT: 'true'
      - name: OpenMDAO.jl Tests
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate("./julia/OpenMDAO.jl")
          Pkg.develop(path="./julia/OpenMDAOCore.jl")
          using CondaPkg
          # Path needs to be relative to the CondaPkg.toml file, which is in julia/OpenMDAO.jl.
          CondaPkg.add_pip("omjlcomps"; version="@./../../python", editable=true)
          Pkg.instantiate()
          Pkg.update()
          Pkg.test()
        # env:
        #       JULIA_PKG_USE_CLI_GIT: 'true'

  omjlcomps:
    name: Python ${{ matrix.python-version }} - ${{ matrix.os }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        julia-version:
          - '1.12' # Leave this line unchanged. '1' will automatically expand to the latest stable 1.x release of Julia.
        os:
          - ubuntu-latest
          - macOS-latest
        # python-version: ["3.10", "3.11", "3.12", "3.13"]
        python-version: ["3.12"]
        exclude:
          # No idea why this is segfaulting.
          # Only sometimes.
          - os: macOS-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.julia-version }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Add General Registry
        shell: julia --color=yes {0}
        run: |
          using Pkg
          # Pkg.Registry.add("General")
          Pkg.Registry.add(RegistrySpec(url="https://github.com/JuliaRegistries/General"))
          Pkg.Registry.update()
          Pkg.Registry.status()
      #   # env:
      #   #       JULIA_PKG_USE_CLI_GIT: 'true'
      - name: Install juliapkg and add latest version of OpenMDAOCore.jl
        run: |
          echo "PWD = $PWD"
          # Get the json file with all the test dependencies, and that will install the local version of OpenMDAOCore.jl.
          # cp $PWD/python/omjlcomps/test/juliapkg-test.json $PWD/python/omjlcomps/juliapkg.json
          # cp $PWD/python/test/juliapkg-test.json $PWD/python/src/juliapkg.json
          python -m pip install --upgrade pip
          pip install juliapkg'[cli]'
          python -m juliapkg resolve
          cat ./julia/OpenMDAOCore.jl/Project.toml
          # python -m juliapkg add --dev OpenMDAOCore --path=$PWD/julia/OpenMDAOCore.jl
          python -m juliapkg resolve
        # env:
        #   JULIA_PKG_SERVER: ""  # Forces fallback to uncompressed Git cloning
      - name: omjlcomps install
        run: |
          echo "PWD = $PWD"
          # WTF?
          python -m juliapkg run -E 'using Pkg; rm(joinpath(DEPOT_PATH[1], "registries", "General"), force=true, recursive=true); Pkg.Registry.add("General")'
          python -m juliapkg add --dev --path=$PWD/julia/OpenMDAOCore.jl --target=$PWD/python/src/juliapkg.json OpenMDAOCore
          pip install --config-settings editable_mode=compat -e ./python
          python -c "import juliapkg; juliapkg.resolve()"
        # env:
        #       JULIA_PKG_USE_CLI_GIT: 'true'
        # env:
        #   JULIA_PKG_SERVER: ""  # Forces fallback to uncompressed Git cloning
      - name: omjlcomps tests
        run: |
          echo "PWD = $PWD"
          # python ./python/test/test_julia_explicit_comp.py
          # python ./python/test/test_julia_implicit_comp.py
          # # python ./python/test/test_aviary_support.py
          # python ./python/test/test_explicit_ad_shape_by_conn.py
          cd python/test
          python test_julia_explicit_comp.py
          python test_julia_implicit_comp.py
          python test_explicit_ad_shape_by_conn.py
        # env:
        #       JULIA_PKG_USE_CLI_GIT: 'true'
      - name: test examples
        run: |
          echo "PWD = $PWD"
          cd ./examples/example_python_package_openmdao_jl
          python -m juliapkg add --dev --path=$PWD/../../julia/OpenMDAOCore.jl --target=$PWD/example_python_package_openmdao_jl/juliapkg.json OpenMDAOCore
          pip install --config-settings editable_mode=compat -e .
          python ./scripts/run_paraboloid.py
          python ./example_python_package_openmdao_jl/test/test_paraboloid_example.py
          python ./scripts/run_circle.py
          python ./example_python_package_openmdao_jl/test/test_circle_example.py
          python ./scripts/run_circuit.py
          python ./example_python_package_openmdao_jl/test/test_circuit_example.py

      - name: Setup debug session on failure
        if: ${{ failure() }}
        uses: owenthereal/action-upterm@v1
        with:
          limit-access-to-actor: true
          wait-timeout-minutes: 15
